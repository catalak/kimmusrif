<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aile bütçesi</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14212b;--mut:#5d6b78;--line:#d8dee4;--acc:#1f4e79;--pos:#22744f;--neg:#b4412f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#10181f;--card:#18232d;--ink:#e6edf3;--mut:#93a1ae;--line:#2a3945;--acc:#7fb2e0;--pos:#5fc794;--neg:#ef8a76}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#10181f;--card:#18232d;--ink:#e6edf3;--mut:#93a1ae;--line:#2a3945;--acc:#7fb2e0;--pos:#5fc794;--neg:#ef8a76}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 'IBM Plex Sans',system-ui,'Segoe UI',sans-serif;font-variant-numeric:tabular-nums}
main{max-width:980px;margin:0 auto;padding:16px}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
nav button{background:none;border:0;padding:10px 14px;font:inherit;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent}
nav button.on{color:var(--ink);border-color:var(--acc);font-weight:600}
.sec{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:16px}
h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:14px 0 6px}
.stats{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end}.stats span{display:block;color:var(--mut);font-size:13px}.stats b{font-size:24px;font-weight:600}
table{border-collapse:collapse;width:100%}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-weight:400}
th{color:var(--mut);font-size:13px}th:first-child,td:first-child{text-align:left}tfoot td{font-weight:600}
.wrap{overflow-x:auto}.sm td,.sm th{padding:4px 3px;font-size:13px}.sm th{white-space:normal;min-width:72px}
input,select,.b{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:5px;padding:7px 9px}
input,select{width:100%}
.b{cursor:pointer;width:auto}.b.p{background:var(--acc);color:var(--card);border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
label{font-size:13px;color:var(--mut);display:block}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mut{color:var(--mut);font-size:13px}
.bar{height:5px;background:var(--acc);opacity:.4;border-radius:3px;min-width:1px}
.big{font-size:40px;font-weight:600;line-height:1.1}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.cardbox{border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:12px}.chead{display:flex;justify-content:space-between;align-items:baseline;font-size:16px}.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:10px 0 12px}.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex-wrap:wrap}.seg button{font:inherit;border:0;border-right:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;cursor:pointer}.seg button:last-child{border-right:0}.seg button.on{background:var(--acc);color:var(--card);font-weight:600}
.notes{border-left:3px solid var(--acc);padding:2px 0 2px 14px;margin-top:16px}.notes p{margin:8px 0;line-height:1.6}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style></head><body><main id="app"></main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TL=n=>new Intl.NumberFormat('tr-TR',{maximumFractionDigits:0}).format(Math.round(n||0))+' ₺';
const INC=['Ek gelir','Kira geliri','Diğer gelir'];
const LEGC=[['market','Market'],['disari','Dışarda yeme'],['kafe','Kafe-kahve'],['ulasim','Ulaşım'],['giyim','Giyim'],['saglik','Sağlık'],['cocuk','Eğitim-çocuk'],['eglence','Eğlence-tatil'],['hediye','Hediye-bayram'],['fatura','Fatura'],['vergi','Vergi-sigorta'],['borc','Borç-taksit'],['konut','Konut'],['diger','Diğer']];
const NEWC=[['market','Market'],['disari','Dışarda yeme'],['ulasim','Ulaşım'],['giyim','Giyim'],['saglik','Sağlık'],['cocuk','Çocuk'],['fatura','Fatura'],['bakim','Bakım'],['eglence','Eğlence-tatil'],['konut','Konut'],['borc','Borç-taksit'],['diger','Diğer']];
const LEGP=[['p1','Ben'],['p2','Eşim'],['p3','Çocuk 1'],['p4','Çocuk 2'],['aile','Tüm aile']];
const NEWP=[['p1','Ben'],['p2','Eşim'],['aile','Tüm aile']];
const mkL=a=>a.map(x=>({id:x[0],name:x[1]}));
const PL=()=>S.people||[],CL=()=>S.cats||[];
const wn=id=>{const p=PL().find(x=>x.id===id);return p?p.name:String(id||'')};
const cn=id=>{const c=CL().find(x=>x.id===id);return c?c.name:String(id||'')};
const optI=(a,v)=>a.map(x=>`<option value="${esc(x.id)}"${x.id===v?' selected':''}>${esc(x.name)}</option>`).join('');
const dcat=id=>CL().some(c=>c.id===id)?id:(CL()[0]||{}).id;
const cutOf=d=>d>10?d-10:Math.min(d+20,28);
function mig(s){if(!s.people){const lg=['tx','fixed','yearly'].some(k=>(s[k]||[]).length);s.people=mkL(lg?LEGP:NEWP);s.cats=mkL(lg?LEGC:NEWC);
  if(lg){const pm={'Ben':'p1','Eşim':'p2','Çocuk 1':'p3','Çocuk 2':'p4','Tüm aile':'aile','Ben':'p1','Eş':'p2','Çocuk 1':'p3','Çocuk 2':'p4'},cm={'Abonelik':'fatura'};LEGC.forEach(x=>cm[x[1]]=x[0]);
   ['tx','fixed','yearly'].forEach(k=>(s[k]||[]).forEach(t=>{if(pm[t.who])t.who=pm[t.who];if(cm[t.cat])t.cat=cm[t.cat]}))}}
 s.stmts=s.stmts||[];s.isrc=s.isrc||DI();if(!s.accts||!s.accts.length){s.accts=[{id:'h1',name:'Ana hesap',bal:0,bm:today.slice(0,7)}];s.defAcct='h1'}s.assets=s.assets||[];s.isrc.forEach(x=>{if(x.day===undefined)x.day=x.id==='ben'?14:(x.id==='es'?15:0)});(s.debts||[]).forEach(d=>{if(d.kind!=='kredi'&&!d.tur){d.tur='TL';d.miktar=d.balance||0;d.kur=1}});(s.cards||[]).forEach(c=>{if(c.stmt>0)s.stmts.push({id:'m'+c.id,card:c.id,dt:sdue(c),amt:c.stmt,odenen:c.paid?c.stmt:(c.odenen||0)});c.stmt=0;c.paid=false;c.odenen=0;c.stmtDue='';c.cut=cutOf(c.due);const nm={'bonus':'Kart 1','vakıf':'Kart 2','yapı kredi':'Kart 3','qnb':'Kart 4'}[String(c.name).trim().toLowerCase()];if(nm)c.name=nm});s.stmts=s.stmts.filter(x=>x.amt>0||x.odenen>0||x.d>0);s.stmts.forEach(x=>{if(x.d===undefined)x.d=x.amt>0&&x.odenen>=x.amt?2:(x.odenen>0?3:0)});return s}
const MN=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const NUM=new Set(['amt','cut','due','stmt','balance','month','ben','es','pay','day','odenen','inst','miktar','kur','bal']);
const pd=s=>({y:+s.slice(0,4),m:+s.slice(5,7)-1,d:+s.slice(8,10)});
const mk=(y,m)=>y*12+m;
const mkd=s=>{const p=pd(s);return mk(p.y,p.m)};
const ml=k=>MN[k%12]+' '+Math.floor(k/12);
const today=new Date().toISOString().slice(0,10);
const DI=()=>[{id:'ben',name:'Ben maaş',ff:1},{id:'bene',name:'Ben ek ödeme',ff:0},{id:'es',name:'Eşim maaş',ff:1},{id:'ek',name:'Ek gelir',ff:0},{id:'kira',name:'Kira geliri',ff:1},{id:'dig',name:'Diğer gelir',ff:0}];
const def=()=>({isrc:DI(),m:mk(2026,10),mode:'cash',extra:0,sal:{ben:0,es:0},
 cards:[[5,15],[8,18],[10,20],[15,25]].map((c,i)=>({id:'k'+(i+1),name:['Kart 1','Kart 2','Kart 3','Kart 4'][i],cut:c[0],due:c[1],stmt:0,stmtDue:''})),
 fixed:[],yearly:[],debts:[],tx:[],stmts:[]});
let S=def(),tab=1,F={type:'out',date:today,cat:null,who:'aile',pay:'cash'},dbDoc=null,tm;
try{const j=JSON.parse(localStorage.getItem('butce')||'null');if(j)S=Object.assign(def(),j);mig(S)}catch(e){}
let ST='Değişiklikler otomatik kaydedilir',dirty=false,EI=-1;
function stat(t){ST=t;const e=$('#st');if(e)e.textContent=t}
function save(){let ok=false;try{localStorage.setItem('butce',JSON.stringify(S));ok=true}catch(e){}
 stat(ok?'Bu tarayıcıya kaydedildi':'Kaydedilemedi');
 dirty=true;clearTimeout(tm);tm=setTimeout(()=>{if(!dbDoc){dirty=false;return}dbDoc.set({s:JSON.stringify(S)}).then(()=>{dirty=false;stat('Kaydedildi (ortak veritabanı)')}).catch(()=>{dirty=false;stat(ok?'Yalnız bu tarayıcıda kayıtlı':'Kaydedilemedi')})},400)}
(async()=>{try{const db=window.claude&&await claude.use('db');if(!db){stat('Ortak veriye bağlanılamadı (giriş yapılmamış olabilir)');return}dbDoc=db.doc('budget/main');
 dbDoc.onSnapshot(sn=>{if(sn.hasPendingWrites||(sn.metadata&&sn.metadata.hasPendingWrites))return;
  const d=typeof sn.data==='function'?sn.data():sn.data;
  if(d&&d.s){if(dirty||d.s===JSON.stringify(S)||(document.activeElement&&/INPUT|SELECT/.test(document.activeElement.tagName)))return;S=mig(Object.assign(def(),JSON.parse(d.s)));try{localStorage.setItem('butce',d.s)}catch(e){}render()}
  else if(!sn.fromCache)dbDoc.set({s:JSON.stringify(S)}).catch(()=>{})},()=>{})}catch(e){}})();

const card=id=>S.cards.find(c=>c.id===id);
const pn=id=>id==='cash'?'Nakit':(card(id)?card(id).name:'?');
const opt=(a,v)=>a.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('');
const sum=a=>a.reduce((x,y)=>x+y,0);
const YY=()=>S.yy||new Date().getFullYear();
const yA=(y,Y)=>{const a=y.ya||{};if(a[Y]!==undefined)return a[Y];const ks=Object.keys(a).map(Number).filter(k=>k<Y).sort((p,q)=>q-p);return ks.length?a[ks[0]]:y.amt};
function yset(i,v){const y=S.yearly[i];y.ya=y.ya||{};y.ya[YY()]=parseFloat(v)||0;save()}
const yvs=ys=>S.yearly.flatMap(y=>ys.map(Y=>({id:'y',type:'out',date:Y+'-'+String(y.month||1).padStart(2,'0')+'-'+String(Math.min(y.day||15,28)).padStart(2,'0'),amt:yA(y,Y),cat:y.cat,who:y.who,pay:y.pm||'cash',inst:y.inst||1})));
const yv=M=>yvs([Math.floor(M/12)-1,Math.floor(M/12)]);
const AX=()=>{const Y=Math.floor(nowM()/12);return[...S.tx,...yvs([Y-1,Y,Y+1])]};
const paidOf=c=>c.paid?c.stmt:Math.min(c.odenen||0,c.stmt);
function sdue(c){if(c.stmtDue)return c.stmtDue;const n=pd(today),cm=mk(n.y,n.m)-(n.d>c.cut?0:1),dm=cm+(c.due>c.cut?0:1),y=Math.floor(dm/12),m=dm%12,d=Math.min(c.due,new Date(y,m+1,0).getDate());return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
function cardNm(c){const n=pd(today);return mk(n.y,n.m)+(n.d>c.cut?1:0)}
function inst(t){const c=card(t.pay);if(!c)return[];const p=pd(t.date),n=t.inst||1,r=[];
 for(let i=0;i<n;i++){const sm=mk(p.y,p.m)+i+(p.d>c.cut?1:0);r.push({sm,k:sm+(c.due>c.cut?0:1),a:t.amt/n,c})}return r}
const sPaid=x=>x.d===2?x.amt:x.d===1?(x.asg||x.amt*.4):(x.d===3?(x.odenen||0):0);
const carry=(c,M)=>sum(S.stmts.filter(x=>x.card===c.id&&mkd(x.dt)===M-1&&x.amt>0&&(x.d===1||x.d===3)).map(x=>Math.max(0,x.amt-sPaid(x))));
function cardEst(c,M){let a=0;[...S.tx,...yv(M)].forEach(t=>{if(t.pay===c.id&&t.type!=='in')inst(t).forEach(x=>{if(x.k===M)a+=x.a})});return a}
const defDt=(c,M)=>{const y=Math.floor(M/12),m=M%12;return y+'-'+String(m+1).padStart(2,'0')+'-'+String(Math.min(c.due,new Date(y,m+1,0).getDate())).padStart(2,'0')};
function sset(cid,f,v){let j=S.stmts.findIndex(x=>x.card===cid&&mkd(x.dt)===S.m);
 if(j<0){S.stmts.push({id:'s'+Date.now()+cid,card:cid,dt:defDt(card(cid),S.m),amt:0,asg:0,d:0,odenen:0});j=S.stmts.length-1}
 S.stmts[j][f]=(f==='dt'||f==='acct')?v:(f==='d'?+v:(parseFloat(v)||0));save();render()}
const cardSure=(c,M)=>sum(S.stmts.filter(x=>x.card===c.id&&mkd(x.dt)===M&&(x.amt>0||x.odenen>0)).map(x=>sPaid(x)||x.amt));
const cardTah=(c,M)=>S.stmts.some(x=>x.card===c.id&&mkd(x.dt)===M&&(x.amt>0||x.odenen>0))?0:cardEst(c,M)+carry(c,M);
function cardDue(c,M){const st=S.stmts.filter(x=>x.card===c.id&&mkd(x.dt)===M&&(x.amt>0||x.odenen>0));
 if(st.length)return sum(st.map(x=>sPaid(x)||x.amt));
 return cardEst(c,M)+carry(c,M)}
const ymk=s=>{const p=String(s).split('-');return mk(+p[0],+p[1]-1)};
const nowM=()=>mkd(today);
const on=(f,M)=>(!f.from||ymk(f.from)<=M)&&(!f.to||M<=ymk(f.to));
const loanOn=(d,M)=>d.pay>0&&d.end&&M>=nowM()&&M<=ymk(d.end);
const loanLeft=d=>d.pay>0&&d.end?d.pay*Math.max(0,ymk(d.end)-nowM()+1):0;
const ffOf=f=>{const x=(S.isrc||[]).find(y=>y.id===f);return !!(x&&x.ff)};
const ikey=k=>Math.floor(k/12)+'-'+String(k%12+1).padStart(2,'0');
function iv(M,f){const e=S.inc||{};for(let k=M,n=0;n<36;k--,n++){const v=(e[ikey(k)]||{})[f];if(v!==undefined)return v;if(!ffOf(f))break}return 0}
const incM=M=>sum((S.isrc||[]).map(x=>iv(M,x.id)));
function setInc(k,f,v){S.inc=S.inc||{};const o=S.inc[ikey(k)]=S.inc[ikey(k)]||{};if(v==='')delete o[f];else o[f]=parseFloat(v)||0;save();
 document.querySelectorAll('input[data-f]').forEach(i=>{const K=+i.dataset.k,g=i.dataset.f;if(ffOf(g))i.placeholder=iv(K,g)||'';const t=document.getElementById('t'+K);if(t)t.innerHTML='<b>'+TL(incM(K))+'</b>'})}
function vGelir(){const s=nowM()+(S.io||0),rows=[],src=S.isrc||[];
 for(let k=s;k<s+12;k++){const e=(S.inc||{})[ikey(k)]||{};rows.push(`<tr><td>${ml(k)}</td>${src.map(x=>`<td><input data-k=${k} data-f=${x.id} style="width:86px;padding:5px 6px;font-size:13px" type=number step=any value="${e[x.id]??''}" placeholder="${x.ff?iv(k,x.id)||'':''}" onchange="setInc(${k},'${x.id}',this.value)"></td>`).join('')}<td id=t${k}><b>${TL(incM(k))}</b></td></tr>`)}
 return `<div class=sec><h2>Aylık gelirler (net, hesaba geçen)</h2>
 <div class=row><button class=b onclick="S.io=(S.io||0)-12;save();render()">Önceki 12 ay</button><button class=b onclick="S.io=(S.io||0)+12;save();render()">Sonraki 12 ay</button></div>
 <div class=wrap><table class=sm><thead><tr><th>Ay</th>${src.map(x=>`<th>${esc(x.name)}</th>`).join('')}<th>Toplam</th></tr></thead><tbody>${rows.join('')}</tbody></table></div></div>
 <div class=sec><h2>Gelir kalemleri</h2><p class=mut>Her kalemi istediğin gibi adlandır. "Her ay devam etsin" işaretliyse (maaş, kira geliri gibi) boş bıraktığın aylarda önceki ayın tutarı geçerli olur. İşaretli değilse (ikramiye, ek gelir gibi) sadece yazdığın ayda sayılır.</p>
 ${src.map((x,i)=>`<div class=row><input style="flex:2;min-width:160px" value="${esc(x.name)}" onchange="U('isrc',${i},'name',this.value,1)"><input type=number min=1 max=31 placeholder="Ayın kaçı" title="Ayın kaçında yatıyor" style="width:110px" value="${x.day||''}" onchange="U('isrc',${i},'day',this.value)">${acSel('isrc',i,x.acct)}<label style="display:flex;gap:6px;align-items:center;color:var(--ink);font-size:14px"><input type=checkbox style="width:auto" ${x.ff?'checked':''} onchange="S.isrc[${i}].ff=this.checked?1:0;save();render()">Her ay devam etsin</label><button class=b onclick="del('isrc',${i})">Sil</button></div>`).join('')}
 <button class=b onclick="S.isrc.push({id:'g'+Date.now(),name:'Yeni gelir',ff:0});save();render()">Gelir kalemi ekle</button></div>`}
function calc(M){
 const ex=S.tx.filter(t=>t.type!=='in'),yr=S.yearly.filter(y=>y.month-1===M%12).map(y=>({...y,amt:yA(y,Math.floor(M/12))})),fx=S.fixed.filter(f=>on(f,M)),ln=S.debts.filter(d=>d.kind==='kredi'&&loanOn(d,M));
 const inc=incM(M)+sum(S.tx.filter(t=>t.type==='in'&&mkd(t.date)===M).map(t=>t.amt));
 const items=[...ex.filter(t=>mkd(t.date)===M),...fx,...yr,...ln.map(d=>({cat:'borc',who:'aile',amt:d.pay}))].map(t=>({cat:t.cat,who:t.who,a:t.amt}));
 const cash=sum(ex.filter(t=>t.pay==='cash'&&mkd(t.date)===M).map(t=>t.amt))+sum(fx.map(f=>f.amt))+sum(ln.map(d=>d.pay))+sum(yr.filter(f=>!f.pm||f.pm==='cash').map(f=>f.amt))+sum(S.cards.map(c=>cardSure(c,M)));
 const est=sum(S.cards.map(c=>cardTah(c,M)));
 return{inc,items,spend:sum(items.map(i=>i.a)),cash,est,fixed:sum(fx.map(f=>f.amt))+sum(ln.map(d=>d.pay))}}

function U(k,i,f,v,r){const o=i==null?S[k]:S[k][i];if(k==='fixed'&&(f==='from'||f==='to')){const a=f==='from'?v:o.from,b=f==='to'?v:o.to;if(a&&b&&b<a){render();stat('Bitiş ayı başlangıçtan önce olamaz');return}}o[f]=NUM.has(f)?(parseFloat(v)||0):v;if(k==='cards'&&f==='due')o.cut=cutOf(o.due);if((k==='debts'||k==='assets')&&f==='kur')o.kt=today;if((k==='debts'||k==='assets')&&f==='tur'){if(v==='TL')o.kur=1;else if(o.kur===1)o.kur=0}save();if(r)render()}
function del(k,i){if(k==='tx')EI=-1;S[k].splice(i,1);save();render()}
function zam(i){const f=S.fixed[i],n=nowM()+1,s=k=>Math.floor(k/12)+'-'+String(k%12+1).padStart(2,'0');S.fixed.splice(i+1,0,{...f,from:s(n),to:''});if(!f.from||f.from<=s(n-1))f.to=s(n-1);save();render()}
function snap(){F.date=$('#dt').value;F.amt=$('#am').value;F.cat=$('#ca').value;F.note=$('#nt').value;if($('#wh'))F.who=$('#wh').value;if($('#in'))F.inst=$('#in').value;if($('#ac'))F.acct=$('#ac').value}
function edit(i){const t=S.tx[i];EI=i;Object.assign(F,{type:t.type,date:t.date,cat:t.cat,who:t.who,pay:t.pay,amt:t.amt,inst:t.inst||1,note:t.note||'',acct:t.acct||null});render();scrollTo(0,0)}
function cancelEdit(){EI=-1;F.amt='';F.note='';F.inst=1;render()}
async function bkSave(){let d=null;try{d=window.claude?await claude.use('downloads'):null}catch(e){}
 if(!d){stat('Dosya indirme bu görünümde yok, metni kopyalayabilirsin');return}

function vProj(){const s0=nowM(),rows=[],oth=sum(S.assets.map(dTL)),lns=S.debts.filter(d=>d.kind==='kredi'&&d.pay>0),bl=S.debts.filter(d=>d.kind!=='kredi');
 const nrem=(d,k)=>d.end?Math.max(0,ymk(d.end)-k):0;
 const kart=k=>sum(S.stmts.filter(x=>x.amt>0).map(x=>mkd(x.dt)>k?x.amt:Math.max(0,x.amt-(sPaid(x)||x.amt))));
 const debt=k=>sum(lns.map(d=>d.pay*nrem(d,k)))+sum(bl.map(dTL))+kart(k);
 const longD=k=>sum(lns.map(d=>d.pay*Math.max(0,nrem(d,k)-12)))+sum(bl.filter(d=>d.uz).map(dTL));
 let ti=0,tk=0,te=0;
 for(let k=s0;k<s0+12;k++){const c=calc(k),nb=sum(S.accts.map(a=>balEnd(a,k))),db=debt(k);ti+=c.inc;tk+=c.cash;te+=c.est;rows.push({k,inc:c.inc,kes:c.cash,est:c.est,net:c.inc-c.cash,nb,db,nv:nb+oth-db})}
 const f=rows[0],l=rows[11],tn=ti-tk,low=rows.reduce((a,b)=>b.nb<a.nb?b:a),dd=f.db-l.db,dn=l.nv-f.nv,sg=v=>(v>=0?'+':'−')+TL(Math.abs(v)),nt=[];
 nt.push(`Önümüzdeki 12 ayda ${TL(ti)} gelir ve ${TL(tk)} kesinleşmiş ödeme görünüyor. Fark yaklaşık ${TL(Math.abs(tn))} ${tn>=0?'artı':'eksi'}.`);
 nt.push(`Hesaplarındaki toplam nakit bu ay sonu yaklaşık ${TL(f.nb)}, 12 ay sonunda ${TL(l.nb)} olması bekleniyor.`);
 if(f.db>0)nt.push(dd>0?`Toplam borç (faiz hariç) ${TL(f.db)} seviyesinden ${TL(l.db)} seviyesine iniyor, yani 12 ayda yaklaşık ${TL(dd)} eriyor.${longD(s0+11)>0?` Kalan borcun ${TL(longD(s0+11))} kadarı 12 aydan sonraya uzanan uzun vadeli kısım.`:''}`:`Toplam borç (faiz hariç) ${TL(f.db)} civarında, bu dönemde azalmıyor görünüyor.`);
 nt.push(`Net varlığın ${TL(f.nv)} seviyesinden ${TL(l.nv)} seviyesine ${dn>=0?'çıkıyor':'düşüyor'} (${sg(dn)}). Uzun vadeli krediler dahil bütün borçlar düşüldüğü için bu rakam eksi olabilir, asıl önemli olan yönü.`);
 if(low.nb<0)nt.push(`${ml(low.k)} ayında hesaplarındaki toplam nakit eksiye (${TL(low.nb)}) düşüyor görünüyor. Maaş ya da ek gelir günlerini, o aydaki büyük ödemeleri bir kontrol etmek iyi olur.`);
 else nt.push(`Nakit en düşük ${ml(low.k)} ayında (${TL(low.nb)}).`);
 nt.push(`Gelecek aylarda kart ekstreleri henüz girilmediği için kesin ödemeler olduğundan düşük görünebilir.${te>0.5?` Ekstresi girilmemiş kartların tahmini ödemeleri (${TL(te)}) hesaba dahil değil.`:''}`);
 const cl=v=>v<0?' class=neg':'',st='style="font-size:19px"';
 const vi=[...S.accts.map(a=>[a.name,balEnd(a,s0),balEnd(a,s0+11)]),...S.assets.map(a=>[a.name,dTL(a),dTL(a)])];
 const bi=[...(kart(s0)||kart(s0+11)?[['Kart ekstreleri',kart(s0),kart(s0+11)]]:[]),...lns.map(d=>[d.name,d.pay*nrem(d,s0),d.pay*nrem(d,s0+11)]),...bl.map(d=>[d.name+(d.uz?' (uzun vadeli)':''),dTL(d),dTL(d)])];
 const tt=(a,j)=>sum(a.map(x=>x[j])),t2=(ti2,it,e)=>`<div><h3 style="margin-top:0">${ti2}</h3><table><thead><tr><th></th><th>Bu ay sonu</th><th>12 ay sonu</th></tr></thead><tbody>${it.map(x=>`<tr><td>${esc(x[0])}</td><td>${TL(x[1])}</td><td>${TL(x[2])}</td></tr>`).join('')||'<tr><td class=mut>Henüz yok</td><td></td><td></td></tr>'}</tbody><tfoot><tr><td>Toplam</td><td>${TL(tt(it,1))}</td><td>${TL(tt(it,2))}</td></tr></tfoot></table></div>`;
 const uz0=longD(s0);
