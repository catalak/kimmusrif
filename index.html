<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kim Müsrif?</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
<script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then(registration => {
          // Yeni bir güncelleme (yeni sw.js) algılandığında
          registration.addEventListener('updatefound', () => {
            const newWorker = registration.installing;
            newWorker.addEventListener('statechange', () => {
              // Yeni sürüm arka planda cihaza indiğinde ve hazır olduğunda
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                console.log('Yeni versiyon bulundu, sayfa güncelleniyor...');
                // Sayfayı otomatik olarak en güncel haliyle yenile
                window.location.reload(true);
              }
            });
          });
        }).catch(err => console.log('SW Hata:', err));
      });
    }
  </script>
</body>
</html>
