<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kim Müsrif?</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css?v=12">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div id="login-screen" style="display:none; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:24px; text-align:center; background:#F8FAFC;">
  <h1 style="margin:0 0 12px 0; font-size:32px; font-weight:800; color:#0F172A; letter-spacing:-0.5px;">Kim Müsrif?</h1>
  <p style="margin:0 0 28px 0; max-width:340px; font-size:14px; line-height:1.5; color:#64748B;">
    Aile bütçeni yönetmek için giriş yap. Verilerin sadece sana özel ve güvenli bir şekilde saklanır.
  </p>

  <div style="display:flex; flex-direction:column; gap:12px; width:100%; max-width:280px;">
    <button id="btn-guest-login" style="width:100%; padding:13px 20px; background:#FFFFFF; color:#334155; border:1px solid #CBD5E1; border-radius:14px; font-size:14px; font-weight:700; cursor:pointer; box-shadow:0 2px 6px rgba(15,23,42,0.04);">
      Üye Olmadan Devam Et
    </button>

    <button id="btn-google-login" style="width:100%; padding:13px 20px; background:#FFFFFF; color:#0F172A; border:1px solid #CBD5E1; border-radius:14px; font-size:15px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; box-shadow:0 4px 12px rgba(15,23,42,0.06);">
      <svg width="20" height="20" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      <span>Google ile Giriş Yap</span>
    </button>
  </div>
  <div id="login-error" style="display:none; margin-top:16px; color:#EF4444; font-size:13px; font-weight:600;">Giriş yapılamadı, tekrar deneyin.</div>
</div>
  
  <div id="app-container" style="display: none;">
    <main id="app"></main>
  </div>

  <script src="js/storage.js?v=12"></script>
  <script src="js/core.js?v=12"></script>
  <script src="js/views.js?v=12"></script>
  <script src="js/app.js?v=12"></script>

  <script>
    // KESİN CACHE TEMİZLEYİCİ (Eski inatçı SW'yi yok eder ve taze dosyaları çeker)
    if(!localStorage.getItem('v12_cache_cleared')) {
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    registration.unregister();
                }
                localStorage.setItem('v12_cache_cleared', 'true');
                window.location.reload(true);
            });
        }
    } else {
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Hata:', err));
          });
        }
    }
  </script>
</body>
</html>
