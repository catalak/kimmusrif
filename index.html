<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kim Müsrif?</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div id="login-screen" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: var(--bg); text-align: center; padding: 20px; box-sizing: border-box;">
    <h1 style="color: var(--ink); margin-bottom: 10px;">Kim Müsrif?</h1>
    <p style="color: var(--mut); margin-bottom: 30px; max-width: 400px;">Aile bütçeni yönetmek için giriş yap. Verilerin sadece sana özel ve güvenli bir şekilde saklanır.</p>
    <button id="btn-google-login" style="background: white; color: #444; border: 1px solid #ccc; padding: 12px 24px; border-radius: 24px; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); transition: all 0.2s;">
      <i class="fab fa-google" style="color: #DB4437; font-size: 18px;"></i> Google ile Giriş Yap
    </button>
    <div id="login-error" style="color: #E74C3C; margin-top: 15px; font-size: 14px; display: none;">Giriş yapılamadı, lütfen tekrar dene.</div>
  </div>
  
  <div id="app-container" style="display: none;">
    <main id="app"></main>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/core.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Hata:', err));
      });
    }
  </script>
</body>
</html>
